<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-color-scheme="light" data-theme-color="blue" style="color-scheme: light;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Pawchive Downloader</title>
<link rel="stylesheet" href="/prerender/app.css">
<style>body{display:grid;place-items:center;min-height:100vh;margin:0;background:var(--console-page,var(--background,#f7f8fb));}</style>
</head>
<body>
<!-- 登录页（元素来自原版 KToolBox 渲染——保留类名结构，样式由 app.css 提供） -->
<div class="surface surface--secondary form-surface control-surface rounded-lg border border-border mx-auto w-full max-w-md p-6 sm:p-8" data-slot="surface">
  <div class="mb-6"><h1 class="text-2xl font-semibold">登录此同步项目</h1><p class="mt-2 text-sm leading-relaxed text-muted">请使用项目所有者配置的账户。</p></div>
  <div class="alert alert--warning mb-6 rounded-lg" data-slot="alert-root">
    <div class="alert__indicator" data-slot="alert-indicator"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-shield-exclamation" aria-hidden="true"><path d="M15.04 19.745c-.942 .551 -1.964 .976 -3.04 1.255a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 .195 6.015"></path><path d="M19 16v3"></path><path d="M19 22v.01"></path></svg></div>
    <div class="alert__content" data-slot="alert-content"><p class="alert__title" data-slot="alert-title">仅在可信网络中使用</p><span class="alert__description" data-slot="alert-description">当前会话使用 HTTP，凭据和任务数据在传输过程中不会加密。</span></div>
  </div>
  <form id="loginForm" class="grid gap-5">
    <div data-slot="textfield" class="textfield textfield--full-width grid gap-1.5" data-rac="" data-required="true">
      <label class="label field-label flex min-w-0 flex-1 items-center gap-1.5 text-sm font-semibold text-[var(--text-secondary)]" data-slot="label"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-user field-label-icon shrink-0" aria-hidden="true"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path></svg><span class="min-w-0 break-words leading-snug">用户名</span></label>
      <input id="username" name="username" required="" autocomplete="username" tabindex="0" class="input input--secondary" data-slot="input" data-rac="" type="text" value="" title="">
    </div>
    <div data-slot="textfield" class="textfield textfield--full-width grid gap-1.5" data-rac="" data-required="true">
      <label class="label field-label flex min-w-0 flex-1 items-center gap-1.5 text-sm font-semibold text-[var(--text-secondary)]" data-slot="label"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-key field-label-icon shrink-0" aria-hidden="true"><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0"></path><path d="M15 9h.01"></path></svg><span class="min-w-0 break-words leading-snug">密码</span></label>
      <div role="presentation" class="input-group input-group--secondary" data-slot="input-group" data-rac="">
        <input id="password" name="password" required="" autocomplete="off" tabindex="0" class="input-group__input" data-slot="input-group-input" data-rac="" type="password" value="" title="">
        <div class="input-group__suffix p-1" data-slot="input-group-suffix">
          <button data-slot="button" class="button button--icon-only button--sm button--ghost" data-rac="" type="button" tabindex="0" aria-label="显示密码" id="showPass"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-eye" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"></path></svg></button>
        </div>
      </div>
      <p id="loginErr" class="hidden" style="color:var(--danger,#dc2626);font-size:12px;margin:0;"></p>
    </div>
    <button data-slot="button" class="button button--md button--primary mt-1 w-full" data-rac="" type="submit" tabindex="0"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tabler-icon tabler-icon-login" aria-hidden="true"><path d="M15 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"></path><path d="M21 12h-13l3 -3"></path><path d="M11 15l-3 -3"></path></svg>登录</button>
  </form>
</div>
<script>
(function(){
  var f=document.getElementById("loginForm"),err=document.getElementById("loginErr");
  document.getElementById("showPass").addEventListener("click",function(){
    var p=document.getElementById("password");p.type=p.type==="password"?"text":"password";
  });
  f.addEventListener("submit",async function(e){
    e.preventDefault();
    err.classList.add("hidden");err.textContent="";
    var r=await fetch("/api/v1/session/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});
    if(r.ok){location.href="/";}else{var j=await r.json().catch(function(){return{};});err.textContent=j.error||("登录失败 HTTP "+r.status);err.classList.remove("hidden");}
  });
})();
</script>
</body>
</html>
