<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dl-server-template</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
    .header { background: #4a90d9; color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; }
    .header button { background: rgba(255,255,255,.2); color: #fff; border: none; padding: .4rem .8rem; border-radius: 4px; cursor: pointer; }
    .content { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .status { padding: .4rem .8rem; border-radius: 4px; font-size: .9rem; display: inline-block; }
    .ok { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="header">
    <h1>dl-server-template 示例</h1>
    <button onclick="logout()">退出</button>
  </div>
  <div class="content">
    <div class="card">
      <h3>服务状态</h3>
      <div id="info" class="status ok">加载中...</div>
    </div>
  </div>
  <script>
    async function api(path, method, body) {
      const opts = { method: method || "GET", headers: {} };
      if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      if (r.status === 401) { location.href = "/login.html"; throw new Error("未登录"); }
      return r.json();
    }
    async function loadInfo() {
      try {
        const data = await api("/api/data/info");
        document.getElementById("info").textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById("info").className = "status err";
        document.getElementById("info").textContent = e.message;
      }
    }
    async function logout() {
      await api("/api/auth/logout", "POST");
      location.href = "/login.html";
    }
    loadInfo();
  </script>
</body>
</html>
