<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 320px; }
    h2 { margin-bottom: 1.5rem; text-align: center; }
    input { width: 100%; padding: .6rem; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 1rem; font-size: 1rem; }
    button { width: 100%; padding: .6rem; background: #4a90d9; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #3a7bc8; }
    .err { color: #e74c3c; text-align: center; margin-bottom: .5rem; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>登录</h2>
    <div id="errMsg" class="err" style="display:none"></div>
    <form id="loginForm">
      <input type="password" id="pwd" placeholder="密码" autofocus>
      <button type="submit">登录</button>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwd = document.getElementById("pwd").value;
      const errEl = document.getElementById("errMsg");
      errEl.style.display = "none";
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pwd }),
        });
        const data = await r.json();
        if (data.ok) {
          location.href = "/";
        } else {
          errEl.textContent = data.error || "登录失败";
          errEl.style.display = "block";
        }
      } catch (err) {
        errEl.textContent = "网络错误";
        errEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
